name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Chart scripts parse
        run: |
          for f in app/src/main/assets/chart.js app/src/main/assets/flow.js; do node --check "$f"; done

      - name: Unit tests
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest

      - name: Lint
        run: ./gradlew lintDebug

      - name: Release build (R8)
        run: ./gradlew assembleRelease
