name: Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew test

      # Updates only install over an earlier version when every release is signed with the same key.
      # Provide it as repository secrets (KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD);
      # without them the APK is built with the debug key and is only attached as a workflow artifact.
      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            {
              echo "COINFLOAT_KEYSTORE_FILE=$RUNNER_TEMP/release.keystore"
              echo "COINFLOAT_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
              echo "COINFLOAT_KEY_ALIAS=$KEY_ALIAS"
              echo "COINFLOAT_KEY_PASSWORD=$KEY_PASSWORD"
              echo "APK_SIGNED=true"
            } >> "$GITHUB_ENV"
          else
            echo "APK_SIGNED=false" >> "$GITHUB_ENV"
          fi

      - name: Build Release APK
        run: ./gradlew assembleRelease

      # Google Play re-signs installs with its own app signing key, so the bundle goes up signed with a
      # separate upload key (UPLOAD_KEYSTORE_BASE64, UPLOAD_KEYSTORE_PASSWORD, UPLOAD_KEY_ALIAS,
      # UPLOAD_KEY_PASSWORD). Play refuses the APK key above as an upload key. Without these secrets the
      # bundle is still built but is not attached to the release, since Play would reject it.
      - name: Build Play bundle
        env:
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
          UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
          UPLOAD_KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
          UPLOAD_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
        run: |
          if [ -n "$UPLOAD_KEYSTORE_BASE64" ]; then
            echo "$UPLOAD_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.keystore"
            COINFLOAT_KEYSTORE_FILE="$RUNNER_TEMP/upload.keystore"             COINFLOAT_KEYSTORE_PASSWORD="$UPLOAD_KEYSTORE_PASSWORD"             COINFLOAT_KEY_ALIAS="$UPLOAD_KEY_ALIAS"             COINFLOAT_KEY_PASSWORD="$UPLOAD_KEY_PASSWORD"               ./gradlew bundleRelease
            rm -f "$RUNNER_TEMP/upload.keystore"
            echo "AAB_FOR_PLAY=true" >> "$GITHUB_ENV"
          else
            echo "::warning::UPLOAD_KEYSTORE_* secrets are missing; the AAB is not signed with the Play upload key"
            ./gradlew bundleRelease
            echo "AAB_FOR_PLAY=false" >> "$GITHUB_ENV"
          fi

      # Manual runs on a branch (fix/xyz) would otherwise put a "/" in the file name
      - name: Rename APK
        run: |
          NAME="${GITHUB_REF_NAME//\//-}"
          echo "APK_NAME=$NAME" >> "$GITHUB_ENV"
          mkdir -p release-artifacts
          cp app/build/outputs/apk/release/app-release.apk "release-artifacts/CoinFloat-$NAME.apk"
          # Google Play takes the bundle, not the APK
          cp app/build/outputs/bundle/release/app-release.aab "release-artifacts/CoinFloat-$NAME.aab"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: CoinFloat-${{ env.APK_NAME }}
          path: release-artifacts/*

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') && env.APK_SIGNED == 'true'
        with:
          files: |
            release-artifacts/CoinFloat-${{ github.ref_name }}.apk
            ${{ env.AAB_FOR_PLAY == 'true' && format('release-artifacts/CoinFloat-{0}.aab', github.ref_name) || '' }}
          generate_release_notes: true
          draft: false
          prerelease: false
