<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TradingView Real-Time Chart</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            background-color: #131722;
            overflow: hidden;
        }
        #chart_box {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            width: 100%;
            height: 100%;
            background-color: #131722;
        }
        .tradingview-widget-container {
            width: 100% !important;
            height: 100% !important;
        }
        .tradingview-widget-container__widget {
            width: 100% !important;
            height: 100% !important;
        }
        iframe {
            width: 100% !important;
            height: 100% !important;
            border: 0 !important;
        }
        #loading_cover {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #131722;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
            color: #848E9C;
            font-size: 13px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            z-index: 99;
            transition: opacity 0.3s ease;
            pointer-events: none;
        }
        .spinner {
            width: 36px;
            height: 36px;
            border: 3px solid #2A2E39;
            border-top: 3px solid #2962FF;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
    <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
</head>
<body>
    <div id="chart_box">
        <div id="tradingview_widget" class="tradingview-widget-container"></div>
    </div>

    <div id="loading_cover">
        <div class="spinner"></div>
        <span>트레이딩뷰 실시간 차트 연결 중...</span>
    </div>

    <script type="text/javascript">
        let currentSymbol = "BINANCE:BTCUSDT.P";
        let widgetInstance = null;

        function hideLoading() {
            const cover = document.getElementById('loading_cover');
            if (cover) {
                cover.style.opacity = '0';
                setTimeout(() => { cover.style.display = 'none'; }, 300);
            }
        }

        function createWidget(symbol) {
            const container = document.getElementById('tradingview_widget');
            container.innerHTML = '';
            
            const cover = document.getElementById('loading_cover');
            if (cover) {
                cover.style.display = 'flex';
                cover.style.opacity = '1';
            }

            try {
                widgetInstance = new TradingView.widget({
                    "autosize": true,
                    "symbol": symbol,
                    "interval": "15",
                    "timezone": "Asia/Seoul",
                    "theme": "dark",
                    "style": "1",
                    "locale": "kr",
                    "toolbar_bg": "#131722",
                    "enable_publishing": false,
                    "allow_symbol_change": true,
                    "container_id": "tradingview_widget",
                    "hide_side_toolbar": false,
                    "withdateranges": true,
                    "save_image": false,
                    "studies": [
                        "STD;SMA",
                        "Volume@tv-basicstudies"
                    ],
                    "disabled_features": [
                        "header_screenshot",
                        "header_compare"
                    ],
                    "enabled_features": [
                        "side_toolbar_in_fullscreen_mode",
                        "save_chart_properties_to_local_storage"
                    ]
                });
            } catch(e) {
                console.error("[TV Widget Init Error]", e);
            }

            setTimeout(hideLoading, 1500);
        }

        function initWhenReady() {
            if (typeof TradingView !== 'undefined' && TradingView.widget) {
                createWidget(currentSymbol);
            } else {
                setTimeout(initWhenReady, 100);
            }
        }

        window.loadSymbol = function(sym) {
            if (!sym) return;
            const clean = sym.trim().toUpperCase();
            const formatted = clean.endsWith("USDT") ? `BINANCE:${clean}.P` : `BINANCE:${clean}`;
            if (formatted === currentSymbol && widgetInstance) {
                return;
            }
            currentSymbol = formatted;
            if (typeof TradingView !== 'undefined' && TradingView.widget) {
                createWidget(currentSymbol);
            }
        };

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initWhenReady);
        } else {
            initWhenReady();
        }
    </script>
</body>
</html>
