<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CoinFloat Pro Chart</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            background-color: #131722;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        #chart_root {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            width: 100%;
            height: 100%;
            background-color: #131722;
        }
        .container-mode {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
        }
        iframe {
            width: 100% !important;
            height: 100% !important;
            border: 0 !important;
        }
        #loading_cover {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #131722;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
            color: #848E9C;
            font-size: 13px;
            z-index: 99;
            transition: opacity 0.25s ease;
            pointer-events: none;
        }
        .spinner {
            width: 32px;
            height: 32px;
            border: 3px solid #2A2E39;
            border-top: 3px solid #2962FF;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
    <script type="text/javascript" src="lightweight-charts.js"></script>
    <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
</head>
<body>
    <div id="chart_root">
        <!-- Mode 1: Official TradingView Widget Container -->
        <div id="tv_container" class="container-mode">
            <div id="tradingview_widget" style="width:100%;height:100%;"></div>
        </div>

        <!-- Mode 2: Ultra High-Speed 100ms Lightweight Canvas -->
        <div id="fast_container" class="container-mode" style="display:none;"></div>
    </div>

    <div id="loading_cover">
        <div class="spinner"></div>
        <span id="loading_text">차트 로딩 중...</span>
    </div>

    <script type="text/javascript">
        let currentMode = "tv"; // "tv" or "fast"
        let currentSymbol = "BTCUSDT";
        let currentInterval = "15"; // TV: "1", "3", "5", "15", "30", "60", "240", "D"
        let tvWidget = null;
        let fastChart = null;
        let fastCandleSeries = null;
        let fastVolumeSeries = null;
        let fastMaSeries = null;
        let fastCandles = [];

        function showLoading(msg) {
            const cover = document.getElementById('loading_cover');
            const txt = document.getElementById('loading_text');
            if (cover) {
                if (txt && msg) txt.innerText = msg;
                cover.style.display = 'flex';
                cover.style.opacity = '1';
            }
        }

        function hideLoading() {
            const cover = document.getElementById('loading_cover');
            if (cover) {
                cover.style.opacity = '0';
                setTimeout(() => { cover.style.display = 'none'; }, 250);
            }
        }

        function getTvSymbolFormatted(sym) {
            const clean = sym.trim().toUpperCase();
            return clean.endsWith("USDT") ? `BINANCE:${clean}.P` : `BINANCE:${clean}`;
        }

        // 1. Official TradingView Widget
        function initTvWidget(symbol, interval) {
            const container = document.getElementById('tradingview_widget');
            container.innerHTML = '';
            showLoading("트레이딩뷰 정식 차트 연결 중...");

            const tvSym = getTvSymbolFormatted(symbol);
            try {
                tvWidget = new TradingView.widget({
                    "autosize": true,
                    "symbol": tvSym,
                    "interval": interval || currentInterval,
                    "timezone": "Asia/Seoul",
                    "theme": "dark",
                    "style": "1",
                    "locale": "kr",
                    "toolbar_bg": "#131722",
                    "enable_publishing": false,
                    "allow_symbol_change": true,
                    "container_id": "tradingview_widget",
                    "hide_side_toolbar": false,
                    "withdateranges": true,
                    "save_image": false,
                    "studies": [
                        "STD;SMA",
                        "Volume@tv-basicstudies"
                    ],
                    "disabled_features": [
                        "header_screenshot",
                        "header_compare"
                    ],
                    "enabled_features": [
                        "side_toolbar_in_fullscreen_mode",
                        "save_chart_properties_to_local_storage"
                    ]
                });
            } catch (e) {
                console.error("TV Init error", e);
            }
            setTimeout(hideLoading, 1500);
        }

        // 2. High-Speed 100ms Canvas Chart
        function initFastChart() {
            const container = document.getElementById('fast_container');
            if (!container || fastChart) return;
            const w = container.clientWidth || window.innerWidth;
            const h = container.clientHeight || window.innerHeight;

            fastChart = LightweightCharts.createChart(container, {
                width: w,
                height: h,
                layout: { background: { color: '#131722' }, textColor: '#787B86', fontSize: 11 },
                grid: { vertLines: { color: '#1E222D' }, horzLines: { color: '#1E222D' } },
                crosshair: { mode: LightweightCharts.CrosshairMode.Normal },
                rightPriceScale: { borderColor: '#2A2E39' },
                timeScale: { borderColor: '#2A2E39', timeVisible: true, secondsVisible: false }
            });

            fastCandleSeries = fastChart.addSeries(LightweightCharts.CandlestickSeries, {
                upColor: '#089981', downColor: '#F23645', borderVisible: false,
                wickUpColor: '#089981', wickDownColor: '#F23645'
            });

            fastVolumeSeries = fastChart.addSeries(LightweightCharts.HistogramSeries, {
                color: '#26a69a', priceFormat: { type: 'volume' }, priceScaleId: ''
            });
            fastVolumeSeries.priceScale().applyOptions({ scaleMargins: { top: 0.8, bottom: 0 } });

            fastMaSeries = fastChart.addSeries(LightweightCharts.LineSeries, {
                color: '#F0B90B', lineWidth: 1, crosshairMarkerVisible: false, lastValueVisible: false, priceLineVisible: false
            });

            window.addEventListener('resize', () => {
                if (fastChart && container) {
                    fastChart.applyOptions({ width: container.clientWidth, height: container.clientHeight });
                }
            });
        }

        async function loadFastData(sym, interval) {
            initFastChart();
            showLoading("초고속 캔들 데이터 수신 중...");
            try {
                const intMap = { "1": "1m", "3": "3m", "5": "5m", "15": "15m", "30": "30m", "60": "1h", "240": "4h", "D": "1d" };
                const binanceInt = intMap[interval] || (interval.endsWith("m") || interval.endsWith("h") || interval.endsWith("d") ? interval : "15m");
                
                const url = `https://fapi.binance.com/fapi/v1/klines?symbol=${sym.toUpperCase()}&interval=${binanceInt}&limit=300`;
                const res = await fetch(url);
                const raw = await res.json();
                
                fastCandles = [];
                const vols = [];
                for (let item of raw) {
                    const time = Math.floor(item[0] / 1000);
                    const open = parseFloat(item[1]);
                    const high = parseFloat(item[2]);
                    const low = parseFloat(item[3]);
                    const close = parseFloat(item[4]);
                    const vol = parseFloat(item[5]);
                    fastCandles.push({ time, open, high, low, close });
                    vols.push({ time, value: vol, color: close >= open ? 'rgba(8, 153, 129, 0.4)' : 'rgba(242, 54, 69, 0.4)' });
                }
                fastCandleSeries.setData(fastCandles);
                fastVolumeSeries.setData(vols);

                const maData = [];
                for (let i = 0; i < fastCandles.length; i++) {
                    if (i < 19) continue;
                    let sum = 0;
                    for (let j = 0; j < 20; j++) sum += fastCandles[i - j].close;
                    maData.push({ time: fastCandles[i].time, value: sum / 20 });
                }
                fastMaSeries.setData(maData);
                fastChart.timeScale().fitContent();
                hideLoading();
            } catch (e) {
                console.error("Fast data error", e);
                hideLoading();
            }
        }

        // Live 100ms Tick Bridge from Android Native App!
        window.updateLiveTick = function(priceFloat) {
            if (!priceFloat || priceFloat <= 0) return;
            if (currentMode === "fast" && fastCandles.length > 0 && fastCandleSeries) {
                const lastIdx = fastCandles.length - 1;
                const last = fastCandles[lastIdx];
                const updated = {
                    time: last.time,
                    open: last.open,
                    high: Math.max(last.high, priceFloat),
                    low: Math.min(last.low, priceFloat),
                    close: priceFloat
                };
                fastCandles[lastIdx] = updated;
                fastCandleSeries.update(updated);
            }
        };

        window.setChartMode = function(mode) {
            currentMode = mode;
            const tvDiv = document.getElementById('tv_container');
            const fastDiv = document.getElementById('fast_container');
            if (mode === "fast") {
                tvDiv.style.display = 'none';
                fastDiv.style.display = 'block';
                loadFastData(currentSymbol, currentInterval);
            } else {
                fastDiv.style.display = 'none';
                tvDiv.style.display = 'block';
                initTvWidget(currentSymbol, currentInterval);
            }
        };

        window.setInterval = function(interval) {
            currentInterval = interval;
            if (currentMode === "fast") {
                loadFastData(currentSymbol, currentInterval);
            } else {
                initTvWidget(currentSymbol, currentInterval);
            }
        };

        window.loadSymbol = function(sym, interval) {
            if (!sym) return;
            currentSymbol = sym.trim().toUpperCase();
            if (interval) currentInterval = interval;
            if (currentMode === "fast") {
                loadFastData(currentSymbol, currentInterval);
            } else {
                initTvWidget(currentSymbol, currentInterval);
            }
        };

        window.addEventListener('DOMContentLoaded', () => {
            initTvWidget(currentSymbol, currentInterval);
        });
    </script>
</body>
</html>
