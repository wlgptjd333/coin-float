<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>CoinFloat Chart</title>
<style>
:root {
    --bg: #131722;
    --panel: #1E222D;
    --line: #2A2E39;
    --text: #D1D4DC;
    --muted: #848E9C;
    --accent: #2962FF;
    --gold: #F0B90B;
    --up: #0ECB81;
    --down: #F6465D;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body {
    width: 100%; height: 100%; background: var(--bg); color: var(--text); overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Noto Sans KR', sans-serif;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
}
button { font: inherit; color: inherit; background: none; border: 0; outline: none; cursor: pointer; }
svg { display: block; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
#app { position: fixed; inset: 0; display: flex; flex-direction: column; }

/* ---- top bar ---------------------------------------------------------------------------------- */
#topbar {
    flex: 0 0 36px; display: flex; align-items: center; gap: 2px; padding: 0 4px;
    background: var(--bg); border-bottom: 1px solid var(--line);
}
.imm { display: none !important; }
#app.immersive .imm { display: flex !important; }
#sym_btn { align-items: center; gap: 3px; padding: 0 8px; height: 30px; border-radius: 6px; font-weight: 700; font-size: 13px; color: #fff; flex: 0 0 auto; }
#sym_btn .caret { color: var(--muted); font-size: 10px; }
#top_price { font-weight: 700; font-size: 13px; padding: 0 8px 0 0; flex: 0 0 auto; font-variant-numeric: tabular-nums; }
#intervals { flex: 1 1 auto; min-width: 0; display: flex; gap: 1px; overflow-x: auto; scrollbar-width: none; }
#intervals::-webkit-scrollbar { display: none; }
.chip { flex: 0 0 auto; height: 30px; padding: 0 9px; border-radius: 6px; font-size: 12.5px; color: var(--muted); }
.chip.active { color: #fff; background: var(--line); font-weight: 600; }
.tb-btn { flex: 0 0 auto; height: 30px; min-width: 30px; padding: 0 8px; border-radius: 6px; font-size: 12.5px; color: var(--text); display: flex; align-items: center; justify-content: center; gap: 4px; }
.tb-btn:active, .chip:active, .tool:active { background: var(--line); }
.tb-btn svg { width: 18px; height: 18px; }
#ind_btn.on { color: var(--gold); }

/* ---- main area ----------------------------------------------------------------------------------- */
#main { position: relative; flex: 1 1 auto; min-height: 0; display: flex; }
#rail {
    flex: 0 0 46px; width: 46px; overflow: hidden; background: var(--bg); border-right: 1px solid var(--line);
    display: flex; flex-direction: column; align-items: center; padding: 4px 0; gap: 1px;
    transition: flex-basis .16s ease, width .16s ease;
}
#app.rail-closed #rail { flex-basis: 0; width: 0; border-right-width: 0; padding: 0; }
.tool { flex: 0 0 auto; width: 42px; height: 44px; border-radius: 8px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; color: var(--muted); font-size: 9.5px; }
.tool svg { width: 20px; height: 20px; }
.tool.active { color: #fff; background: var(--accent); }
.tool.danger.armed { color: #fff; background: var(--down); }
.rail-sep { flex: 0 0 1px; width: 28px; background: var(--line); margin: 3px 0; }
#rail_toggle {
    position: absolute; top: 42%; left: 46px; z-index: 12; width: 16px; height: 46px;
    background: rgba(30, 34, 45, .92); border: 1px solid var(--line); border-left: 0; border-radius: 0 8px 8px 0;
    color: var(--muted); display: flex; align-items: center; justify-content: center;
    transition: left .16s ease;
}
#rail_toggle svg { width: 12px; height: 12px; stroke-width: 2.2; transition: transform .16s ease; }
#app.rail-closed #rail_toggle { left: 0; }
#app.rail-closed #rail_toggle svg { transform: rotate(180deg); }
#chart_wrap { position: relative; flex: 1 1 auto; min-width: 0; touch-action: none; }
#chart { position: absolute; inset: 0; }

#legend {
    position: absolute; top: 4px; left: 8px; right: 6px; z-index: 5; pointer-events: none;
    font-size: 10.5px; line-height: 1.45; color: var(--muted); font-variant-numeric: tabular-nums;
    text-shadow: 0 0 3px var(--bg), 0 0 3px var(--bg);
}
#legend .row { white-space: normal; word-break: keep-all; }
#legend b { color: var(--text); font-weight: 600; }
.up { color: var(--up); } .down { color: var(--down); }
#to_latest {
    position: absolute; right: 64px; bottom: 34px; z-index: 8; width: 34px; height: 34px; border-radius: 17px;
    background: rgba(30, 34, 45, .95); border: 1px solid var(--line); display: none; align-items: center; justify-content: center; color: var(--text);
}
#to_latest.show { display: flex; }
#to_latest svg { width: 16px; height: 16px; stroke-width: 2.2; }
#hint {
    position: absolute; left: 50%; bottom: 40px; transform: translateX(-50%); z-index: 9; padding: 6px 12px; border-radius: 14px;
    background: rgba(41, 98, 255, .92); color: #fff; font-size: 12px; display: none; pointer-events: none; white-space: nowrap;
}
#hint.show { display: block; }
#loading { position: absolute; inset: 0; z-index: 20; background: var(--bg); display: flex; align-items: center; justify-content: center; color: var(--muted); font-size: 13px; gap: 10px; transition: opacity .2s; pointer-events: none; }
#loading.hide { opacity: 0; }
.spinner { width: 22px; height: 22px; border: 3px solid var(--line); border-top-color: var(--accent); border-radius: 50%; animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
#toast { position: absolute; top: 44px; left: 50%; transform: translateX(-50%); z-index: 30; max-width: 90%; padding: 7px 12px; border-radius: 14px; background: rgba(30, 34, 45, .97); border: 1px solid var(--line); font-size: 12px; display: none; align-items: center; gap: 8px; }
#toast.show { display: flex; }
#toast button { background: var(--accent); color: #fff; border-radius: 10px; padding: 3px 9px; font-size: 11.5px; }

/* ---- bottom sheet -------------------------------------------------------------------------------- */
#sheet_bg { position: absolute; inset: 0; z-index: 40; background: rgba(0, 0, 0, .45); display: none; align-items: flex-end; justify-content: center; }
#sheet_bg.show { display: flex; }
#sheet_bg.live { background: transparent; }
#sheet { width: 100%; max-width: 440px; max-height: 88%; overflow-y: auto; background: var(--panel); border-radius: 14px 14px 0 0; padding: 6px 0 12px; box-shadow: 0 -4px 18px rgba(0,0,0,.35); -webkit-overflow-scrolling: touch; }
#sheet_bg.live #sheet { max-height: 52%; }
#sheet h3 { font-size: 14px; padding: 10px 16px 6px; color: #fff; display: flex; align-items: center; gap: 6px; position: sticky; top: 0; background: var(--panel); z-index: 2; }
#sheet h3 .back { color: var(--muted); font-size: 18px; padding: 0 8px 0 0; line-height: 1; }
#sheet h3 .x { margin-left: auto; color: var(--muted); font-size: 18px; padding: 0 4px; }
.row-opt { width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 11px 16px; font-size: 13.5px; text-align: left; }
.row-opt small { display: block; color: var(--muted); font-size: 11px; margin-top: 1px; }
.row-opt:active { background: var(--line); }
.switch { flex: 0 0 38px; width: 38px; height: 22px; border-radius: 11px; background: #3A3F4B; position: relative; transition: background .15s; }
.switch::after { content: ''; position: absolute; top: 2px; left: 2px; width: 18px; height: 18px; border-radius: 9px; background: #fff; transition: transform .15s; }
.switch.on { background: var(--accent); }
.switch.on::after { transform: translateX(16px); }
.check { width: 18px; color: var(--accent); }
.sec { padding: 14px 16px 4px; font-size: 11.5px; color: var(--muted); font-weight: 600; letter-spacing: .02em; }
.note { padding: 8px 16px 4px; font-size: 11.5px; color: var(--muted); line-height: 1.45; }
.gear { color: var(--muted); font-size: 16px; padding: 4px 10px; border-radius: 6px; }
.gear:active { background: var(--line); }
.ma-row { padding-top: 7px; padding-bottom: 7px; }
.ma-row .dot { width: 12px; height: 12px; border-radius: 6px; flex: 0 0 12px; }
.ma-row input { width: 72px; background: #131722; border: 1px solid var(--line); border-radius: 6px; color: #fff; font-size: 14px; padding: 6px 8px; text-align: right; -webkit-user-select: text; user-select: text; }
.fld { padding: 8px 16px; font-size: 13.5px; }
.fld .top { display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 28px; }
.fld .val { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; min-width: 40px; text-align: right; }
.fld small { display: block; color: var(--muted); font-size: 11px; margin-top: 1px; }
.fld input[type=number], .hex { width: 76px; background: #131722; border: 1px solid var(--line); border-radius: 6px; color: #fff; font-size: 14px; padding: 5px 8px; text-align: right; -webkit-user-select: text; user-select: text; }
.hex { width: 84px; text-align: left; font-size: 12px; padding: 4px 6px; }
.fld input[type=range] { width: 100%; margin: 6px 0 0; accent-color: var(--accent); height: 22px; }
.seg { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 6px; }
.seg button { padding: 5px 10px; border-radius: 14px; border: 1px solid var(--line); font-size: 12px; color: var(--muted); }
.seg button.on { background: var(--accent); border-color: var(--accent); color: #fff; }
.sw-strip { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 8px; }
.sw { width: 24px; height: 24px; border-radius: 12px; border: 2px solid transparent; box-shadow: inset 0 0 0 1px rgba(255,255,255,.18); }
.sw.on { border-color: #fff; }
.chip-dot { width: 20px; height: 20px; border-radius: 10px; box-shadow: inset 0 0 0 1px rgba(255,255,255,.25); flex: 0 0 20px; }
.ln { display: flex; align-items: center; gap: 8px; }
.ln input[type=number] { width: 58px; }
.ln .tag { padding: 4px 8px; border-radius: 6px; border: 1px solid var(--line); font-size: 11.5px; color: var(--text); }
.reset { display: block; width: 100%; text-align: center; padding: 12px; color: var(--accent); font-size: 13px; }
.credit { padding: 6px 16px 2px; font-size: 10.5px; color: #5d6574; line-height: 1.4; }

/* ---- price-scale corner (Auto / Log) and drawing style bar ------------------------------------ */
#scale_btns { position: absolute; right: 0; bottom: 0; z-index: 7; display: flex; align-items: stretch; justify-content: center; gap: 2px; padding: 3px 3px; }
#scale_btns button { flex: 1 1 0; min-width: 22px; border-radius: 4px; font-size: 11px; font-weight: 700; color: var(--muted); background: rgba(42, 46, 57, .75); line-height: 1; }
#scale_btns button.on { color: #fff; background: var(--accent); }
#dr_bar { position: absolute; left: 50%; bottom: 36px; transform: translateX(-50%); z-index: 9; display: none; align-items: center; gap: 6px; padding: 5px 8px; background: rgba(30, 34, 45, .96); border: 1px solid var(--line); border-radius: 18px; }
#dr_bar.show { display: flex; }
#dr_bar .sw { width: 20px; height: 20px; border-radius: 10px; }
#dr_bar .tag { white-space: nowrap; min-width: 26px; height: 24px; padding: 0 6px; border-radius: 6px; font-size: 11.5px; color: var(--text); background: var(--line); display: flex; align-items: center; justify-content: center; }
#dr_bar .vsep { width: 1px; height: 18px; background: var(--line); }
.sheet-link { color: var(--muted); font-size: 12px; padding: 10px 16px 2px; display: block; }
</style>
<script src="lightweight-charts.js"></script>
</head>
<body>
<div id="app" class="rail-closed">
    <div id="topbar">
        <button id="sym_btn" class="imm"><span id="sym_name">BTCUSDT</span><span class="caret">▾</span></button>
        <span id="top_price" class="imm"></span>
        <div id="intervals"></div>
        <button id="type_btn" class="tb-btn" aria-label="차트 종류"></button>
        <button id="ind_btn" class="tb-btn" aria-label="지표">지표</button>
        <button id="cfg_btn" class="tb-btn" aria-label="차트 설정"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 0 0-.1-1.2l2-1.5-2-3.4-2.3.9a7 7 0 0 0-2-1.2L14.2 3h-4.4l-.4 2.6a7 7 0 0 0-2 1.2l-2.3-.9-2 3.4 2 1.5a7 7 0 0 0 0 2.4l-2 1.5 2 3.4 2.3-.9a7 7 0 0 0 2 1.2l.4 2.6h4.4l.4-2.6a7 7 0 0 0 2-1.2l2.3.9 2-3.4-2-1.5c.1-.4.1-.8.1-1.2z"/></svg></button>
        <button id="exit_btn" class="tb-btn imm" aria-label="닫기"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>
    <div id="main">
        <div id="rail"></div>
        <button id="rail_toggle" aria-label="그리기 도구 접기/펼치기"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
        <div id="chart_wrap">
            <div id="chart"></div>
            <div id="legend"></div>
            <button id="to_latest" aria-label="최신 봉으로"><svg viewBox="0 0 24 24"><path d="M6 6l6 6-6 6M13 6l6 6-6 6"/></svg></button>
            <div id="scale_btns"><button id="log_btn" aria-label="로그 스케일">L</button><button id="auto_btn" aria-label="자동 맞춤">A</button></div>
            <div id="dr_bar"></div>
            <div id="hint"></div>
            <div id="loading"><div class="spinner"></div><span>차트 불러오는 중...</span></div>
            <div id="toast"><span id="toast_msg"></span><button id="toast_btn">다시 시도</button></div>
        </div>
    </div>
    <div id="sheet_bg"><div id="sheet"></div></div>
</div>

<script src="chart.js"></script>
<script src="flow.js"></script>
</body>
</html>
